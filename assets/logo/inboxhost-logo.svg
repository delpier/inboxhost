<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- InboxHost: casa cuja metade inferior é um tabuleiro de caixa de entrada,
       com um pequeno calendário no interior. 1024×1024, fundo full-bleed. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <!-- dias do calendário recortados (transparentes) para funcionar também a uma só cor -->
    <mask id="cal-days" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <circle cx="472" cy="476" r="11"/><circle cx="512" cy="476" r="11"/><circle cx="552" cy="476" r="11"/>
        <circle cx="472" cy="508" r="11"/><circle cx="512" cy="508" r="11"/>
      </g>
    </mask>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <g id="glyph">
    <g fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
      <path d="M276 482 L512 286 L748 482"/>
      <path d="M346 436 V700 Q346 748 394 748 H630 Q678 748 678 700 V436"/>
      <path d="M346 606 H430 L470 662 H554 L594 606 H678"/>
    </g>
    <!-- calendário -->
    <g id="calendar">
      <g mask="url(#cal-days)">
        <rect x="436" y="404" width="152" height="128" rx="22" fill="#FBBF24"/>
        <path d="M436 444 V426 Q436 404 458 404 H566 Q588 404 588 426 V444 Z" fill="#F59E0B"/>
      </g>
      <rect x="468" y="384" width="18" height="42" rx="9" fill="#FFFFFF"/>
      <rect x="538" y="384" width="18" height="42" rx="9" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
